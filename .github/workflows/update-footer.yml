name: Update Network Sites

on:
  push:
    branches:
      - main  # Runs only on push to the main branch

jobs:
  update-footer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Mobafire Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MOBAFIRE_REPO_TOKEN }}

      - name: Checkout Footer Repository (Read-Only)
        uses: actions/checkout@v4
        with:
          repository: AlexEnnerfelt/moba-network-footer
          path: moba-network-footer
          token: ${{ secrets.FOOTER_REPO_TOKEN }}
          fetch-depth: 1  # Ensures only the latest version is fetched

      - name: Read Data from footer.ini
        run: |
          FOOTER_FILE="moba-network-footer/footer.ini"

          if [ ! -f "$FOOTER_FILE" ]; then
            echo "❌ ERROR: footer.ini not found in moba-network-footer!"
            exit 1
          fi

          echo "✅ Found footer.ini"
          cat "$FOOTER_FILE"

      - name: Extract and Update constants.ini
        run: |
          CONFIG_FILE="public/private/config/constants.ini"
          FOOTER_FILE="moba-network-footer/footer.ini"

          # Ensure files exist
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ ERROR: constants.ini not found in Mobafire repo!"
            exit 1
          fi

          # Extract new values from footer.ini
          NEW_NAMES=$(awk -F '=' '/^SITE_NAMES=/ {gsub(/\[|\]/, "", $2); print $2}' "$FOOTER_FILE" | tr -d '\r')
          NEW_URLS=$(awk -F '=' '/^SITE_URLS=/ {gsub(/\[|\]/, "", $2); print $2}' "$FOOTER_FILE" | tr -d '\r')

          if [ -z "$NEW_NAMES" ] || [ -z "$NEW_URLS" ]; then
            echo "❌ ERROR: Failed to extract network site data from footer.ini!"
            exit 1
          fi

          echo "✅ Extracted Names: $NEW_NAMES"
          echo "✅ Extracted URLs: $NEW_URLS"

          # Replace values in constants.ini
          if grep -q '^;network sites' "$CONFIG_FILE"; then
            sed -i "/^;network sites/,/^;/s|SITE_NAMES=.*|SITE_NAMES=[$NEW_NAMES]|" "$CONFIG_FILE"
            sed -i "/^;network sites/,/^;/s|SITE_URLS=.*|SITE_URLS=[$NEW_URLS]|" "$CONFIG_FILE"
            echo "✅ Updated constants.ini"
          else
            echo "❌ ERROR: ;network sites section not found in constants.ini!"
            exit 1
          fi

      - name: Show Updated constants.ini
        run: cat public/private/config/constants.ini

      - name: Commit and Push Changes to Mobafire
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add public/private/config/constants.ini  # Only commit this file
          git commit -m "Update network sites from footer.ini" || echo "No changes to commit"
          git push
