name: Update Network Sites

on:
  push:
    branches:
      - main  # Runs only on push to the main branch

jobs:
  update-footer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Mobafire Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MOBAFIRE_REPO_TOKEN }}

      - name: Fetch Latest Footer Data
  run: |
    curl -H "Authorization: Bearer ${{ secrets.FOOTER_REPO_TOKEN }}" \
         -o footer.ini \
         -w "%{http_code}" \
         https://raw.githubusercontent.com/AlexEnnerfelt/footer-repo/main/footer.ini
    echo "Download completed with status: $?"

    if [ ! -s footer.ini ]; then
      echo "❌ ERROR: footer.ini is empty or missing!"
      exit 1
    fi


      - name: Verify if footer.ini Exists
        run: |
          if [ -f footer.ini ]; then
            echo "✅ footer.ini exists"
            cat footer.ini
          else
            echo "❌ ERROR: footer.ini not found!"
            ls -la  # List files to see what's in the directory
          fi

      - name: Replace Section in constants.ini
        run: |
          CONFIG_FILE="public/private/config/constants.ini"
          FOOTER_FILE="footer.ini"

          # Extract new arrays from footer.ini
          NEW_NAMES=$(awk '/^\[NetworkSites\]/,/^$/' "$FOOTER_FILE" | grep 'names=' | cut -d '=' -f2)
          NEW_URLS=$(awk '/^\[NetworkSites\]/,/^$/' "$FOOTER_FILE" | grep 'urls=' | cut -d '=' -f2)

          echo "Extracted Names: $NEW_NAMES"
          echo "Extracted URLs: $NEW_URLS"

          # Replace values in constants.ini
          sed -i "/^\[NetworkSites\]/,/^$/s|names=.*|names=${NEW_NAMES}|" "$CONFIG_FILE"
          sed -i "/^\[NetworkSites\]/,/^$/s|urls=.*|urls=${NEW_URLS}|" "$CONFIG_FILE"

      - name: Show Changes Before Commit
        run: cat public/private/config/constants.ini

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A  # Ensure all changes are staged
          git commit -m "Update network sites from footer repo" || echo "No changes to commit"
          git push
